name: Feature request
description: Suggest a workout, device, or integration improvement.
title: "Feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe the problem you want to solve and the result you would find useful. Link an existing request if it is related.
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe your workout, workflow, or application integration.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the CLI command, TUI interaction, output, or integration you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
  - type: textarea
    id: context
    attributes:
      label: Hardware, examples, or references
      description: Add public documentation, mockups, or sanitized examples that clarify the request.
