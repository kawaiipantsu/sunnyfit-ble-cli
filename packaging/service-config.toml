# Configure the bike with an address discovered by `sunnyfit-ble-cli scan`.
# adapter = "hci1"
# device = "AA:BB:CC:DD:EE:FF"
systemd = true
sinks = ["sqlite"]
sqlite_path = "/var/lib/sunnyfit-ble-cli/workouts.sqlite3"
log_file = "/var/log/sunnyfit-ble-cli.log"
reconnect = true
# Keep passwords out of this file: use /etc/default/sunnyfit-ble-cli (root:root 0600).
# All config settings also have --kebab-case CLI and SUNNY_UPPER_CASE environment overrides.
