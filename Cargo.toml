[package]
name = "sunnyfit-ble-cli"
version = "0.4.1"
edition = "2021"
rust-version = "1.90"
description = "Linux Bluetooth workout recorder, terminal dashboard and Redis bridge"
license = "MIT"

[features]
vendored-dbus = ["dep:dbus", "dbus/vendored"]

[dependencies]
anyhow = "1"
bluer = { version = "=0.17.4", features = ["bluetoothd", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dbus = { version = "0.9", optional = true }
futures = "0.3"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util", "process"] }
uuid = { version = "1", features = ["v4"] }

serde = { version = "1", features = ["derive"] }
toml = "0.8"
ratatui = "0.29"
crossterm = "0.28"
directories = "6"

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "mysql", "any"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
fs2 = "0.4"
csv = "1"

[profile.release]
lto = "thin"
strip = true
